apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: home-assistant-certificate
  namespace: home-assistant
spec:
  secretName: home-assistant-local-tls
  duration: 2160h
  renewBefore: 360h
  subject:
    organizations:
      - SeaDogger Homelab
  isCA: false
  privateKey:
    algorithm: RSA
    encoding: PKCS1
    size: 2048
  dnsNames:
    - home-assistant.seadogger-homelab
  issuerRef:
    name: internal-local-issuer
    kind: ClusterIssuer
