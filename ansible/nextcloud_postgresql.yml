---
# Explicit staging reuses the normal Ansible -> ArgoCD -> Kustomize tasks.
# It does not select PostgreSQL for Nextcloud or initiate conversion.
- name: Provision the dedicated Nextcloud PostgreSQL target
  hosts: control_plane
  become: true
  gather_facts: false
  vars_files:
    - config.yml
  tasks:
    - name: Require explicit staging invocation
      ansible.builtin.assert:
        that:
          - nextcloud_postgresql_apply | default(false) | bool
        fail_msg: Set nextcloud_postgresql_apply=true for the reviewed staging operation.

    - name: Stage the database through the shared deployment tasks
      ansible.builtin.import_tasks: tasks/nextcloud_postgresql_deploy.yml
