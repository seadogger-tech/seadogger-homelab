# Stage B0 (OCE-369 / OCE-598): per-container memory peaks and today's live values.
# Peaks are cgroup v2 memory.peak maxima over every container a key sets. peak_mi (P) is the
# max of the OCE-550 snapshot (oce550_peak_mi, read 2026-11-25) and the live re-read of
# 2026-11-25 19:29:53Z-19:30:24Z (live_peak_mi; OCE-600 document peak-reread). live_window_days
# runs to 19:30Z. events_max and oom_kill are memory.events counters at the live read.
# old_* are the live requests/limits from the OCE-550 snapshot, in Mi.
# test_b0_memory_reductions.py asserts the changed files against this table, and that the
# wiki section lists every row.
# request_raised_by_b1: Stage B1 raises this request to P (Guaranteed); B0's
# "no request goes up" check does not apply to it. test_b1_memory_values.py covers it.
containers:
  - name: log-collector (x10)
    file: deployments/rook-ceph/rook-ceph-cluster-values.yaml
    path: cephClusterSpec.resources.logcollector
    peak_mi: 26.5
    window_days: 1.84
    oce550_peak_mi: 26.5
    live_peak_mi: 26.5
    live_window_days: 2.22
    events_max: 0
