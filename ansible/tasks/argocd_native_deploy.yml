---
# Step 1: Set KUBECONFIG globally
- name: Set KUBECONFIG global
  ansible.builtin.set_fact:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

- name: Add ArgoCD Helm repository
  kubernetes.core.helm_repository:
    name: argo
    repo_url: "https://argoproj.github.io/argo-helm"
    state: present
    kubeconfig: "{{ KUBECONFIG }}"

- name: Create ArgoCD namespace
  kubernetes.core.k8s:
    name: argocd
    api_version: v1
    kind: Namespace
    state: present
    kubeconfig: "{{ KUBECONFIG }}"

- name: Deploy ArgoCD with Helm
  kubernetes.core.helm:
    name: argocd
    chart_ref: argo/argo-cd
    release_namespace: argocd
    state: present
    kubeconfig: "{{ KUBECONFIG }}"
    # Pinned to the installed chart: an unpinned run would silently upgrade
    # ArgoCD. Both helm tasks must carry the same values, because each run
    # replaces the release values rather than merging them.
    chart_version: "8.5.8"
    values:
      server:
        service:
          type: ClusterIP
      controller:
        # The application controller had no resources and fell back to the
        # namespace LimitRange default (64Mi) while using ~350Mi, 606Mi peak
        # (2026-10-31), so every node it landed on was under-counted.
        resources:
          requests:
            cpu: 100m
            memory: 384Mi
          limits:
            memory: 1Gi

- name: Force argocd server.service.type=ClusterIP via Helm
  kubernetes.core.helm:
    name: argocd
    chart_ref: argo/argo-cd
    release_namespace: argocd
    state: present
    kubeconfig: "{{ KUBECONFIG }}"
    # Pinned to the installed chart: an unpinned run would silently upgrade
    # ArgoCD. Both helm tasks must carry the same values, because each run
    # replaces the release values rather than merging them.
    chart_version: "8.5.8"
    values:
      server:
        service:
          type: ClusterIP
      controller:
        # The application controller had no resources and fell back to the
        # namespace LimitRange default (64Mi) while using ~350Mi, 606Mi peak
        # (2026-10-31), so every node it landed on was under-counted.
        resources:
          requests:
            cpu: 100m
            memory: 384Mi
          limits:
            memory: 1Gi

# --- Fix the proxy/TLS loop by telling ArgoCD it’s behind TLS-terminating proxy
- name: Set server.insecure=true in argocd-cmd-params-cm
  kubernetes.core.k8s_json_patch:
    api_version: v1
    kind: ConfigMap
    namespace: argocd
    name: argocd-cmd-params-cm
    kubeconfig: "{{ KUBECONFIG }}"
    patch:
      - op: add
        path: /data/server.insecure
        value: "true"
  ignore_errors: false

- name: Set external URL in argocd-cm
  kubernetes.core.k8s_json_patch:
    api_version: v1
    kind: ConfigMap
    namespace: argocd
    name: argocd-cm
    kubeconfig: "{{ KUBECONFIG }}"
    patch:
      - op: add
        path: /data/url
        value: "https://argocd.seadogger-homelab"
  ignore_errors: false

# --- Roll the server so it picks up ConfigMap changes
- name: Restart argocd-server by bumping pod template annotation
  kubernetes.core.k8s:
    kubeconfig: "{{ KUBECONFIG }}"
    state: patched
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: argocd-server
        namespace: argocd
      spec:
        template:
          metadata:
            annotations:
              restartedAt: "{{ ansible_date_time.iso8601 }}"

# --- Wait for rollout to complete
- name: Wait for argocd-server to be ready
  kubernetes.core.k8s_info:
    kubeconfig: "{{ KUBECONFIG }}"
    api_version: apps/v1
    kind: Deployment
    name: argocd-server
    namespace: argocd
  register: argocd_server_dep
  retries: 30
  delay: 5
  until: argocd_server_dep.resources | length > 0 and
         argocd_server_dep.resources[0].status.readyReplicas is defined and
         argocd_server_dep.resources[0].status.readyReplicas >= 1
         

- name: Download ArgoCD IngressRoutes manifest from GitHub
  ansible.builtin.get_url:
    url: "https://raw.githubusercontent.com/seadogger-tech/seadogger-homelab/master/ingress/traefik-argocd-ingress.yml"
    dest: "/tmp/traefik-argocd-ingress.yml"
    mode: "0644"

- name: Apply ArgoCD IngressRoutes (no Helm/Argo)
  kubernetes.core.k8s:
    kubeconfig: "{{ KUBECONFIG }}"
    state: present
    src: "/tmp/traefik-argocd-ingress.yml"
