---
- name: Select the cluster kubeconfig
  ansible.builtin.set_fact:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

- name: Require an immutable reviewed Core revision
  ansible.builtin.assert:
    that:
      - nextcloud_postgresql_revision | default('') is match('^[0-9a-f]{40}$')
    fail_msg: Set nextcloud_postgresql_revision to the reviewed 40-character Core commit.

- name: Check the explicitly selected storage class
  kubernetes.core.k8s_info:
    kubeconfig: '{{ KUBECONFIG }}'
    api_version: storage.k8s.io/v1
    kind: StorageClass
    name: ceph-block-data
  register: nc_db_storage

- name: Read the existing Prometheus rule selection
  kubernetes.core.k8s_info:
    kubeconfig: '{{ KUBECONFIG }}'
    api_version: monitoring.coreos.com/v1
    kind: Prometheus
    name: k8s
    namespace: monitoring
  register: nc_db_prometheus

- name: Require backup rules to be selected across namespaces
  ansible.builtin.assert:
    that:
      - nc_db_prometheus.resources | length == 1
      - nc_db_prometheus.resources[0].spec.ruleSelector == {}
      - nc_db_prometheus.resources[0].spec.ruleNamespaceSelector == {}
    fail_msg: Review monitoring selectors before staging the database and its backup alerts.

- name: Require retained expandable database storage
  ansible.builtin.assert:
    that:
      - nc_db_storage.resources | length == 1
      - nc_db_storage.resources[0].reclaimPolicy == 'Retain'
      - nc_db_storage.resources[0].allowVolumeExpansion | bool

- name: Check credentials without displaying them
  ansible.builtin.assert:
    that:
      - nextcloud_postgresql_admin_password | default('') | length >= 24
      - nextcloud_postgresql_password | default('') | length >= 24
      - nextcloud_postgresql_admin_password != nextcloud_postgresql_password
      - "'\n' not in nextcloud_postgresql_password"
      - "'\r' not in nextcloud_postgresql_password"
      - "'\n' not in nextcloud_postgresql_admin_password"
      - "'\r' not in nextcloud_postgresql_admin_password"
  no_log: true

- name: Read any existing database credentials
  kubernetes.core.k8s_info:
    kubeconfig: '{{ KUBECONFIG }}'
    kind: Secret
    name: nextcloud-db-auth
    namespace: nextcloud
  register: nc_db_existing_secret
  no_log: true

- name: Refuse implicit credential rotation on an initialized database
  ansible.builtin.assert:
    that:
      - nc_db_existing_secret.resources[0].data['db-password'] | b64decode == nextcloud_postgresql_password
      - nc_db_existing_secret.resources[0].data['postgres-password'] | b64decode == nextcloud_postgresql_admin_password
  when: nc_db_existing_secret.resources | length > 0
  no_log: true

- name: Inspect retained database storage before creating credentials
  kubernetes.core.k8s_info:
    kubeconfig: '{{ KUBECONFIG }}'
    kind: PersistentVolumeClaim
    name: nextcloud-db-data
    namespace: nextcloud
  register: nc_db_existing_storage

- name: Refuse new credentials over an existing database volume
  ansible.builtin.assert:
    that:
      - nc_db_existing_secret.resources | length == 1 or nc_db_existing_storage.resources | length == 0
    fail_msg: Existing database storage has no credential Secret. Recover its original credentials before proceeding.

- name: Provision database credentials separately from public GitOps resources
  kubernetes.core.k8s:
    kubeconfig: '{{ KUBECONFIG }}'
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: nextcloud-db-auth
        namespace: nextcloud
      type: Opaque
      stringData:
        db-username: nextcloud
        db-password: '{{ nextcloud_postgresql_password }}'
        postgres-password: '{{ nextcloud_postgresql_admin_password }}'
  no_log: true

- name: Read existing database Application to preserve backup activation
  kubernetes.core.k8s_info:
    kubeconfig: '{{ KUBECONFIG }}'
    api_version: argoproj.io/v1alpha1
    kind: Application
    name: nextcloud-db
    namespace: argocd
  register: nc_db_application

- name: Manage the separate database Application at the reviewed revision
  kubernetes.core.k8s:
    kubeconfig: '{{ KUBECONFIG }}'
    state: present
    definition:
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: nextcloud-db
        namespace: argocd
      spec:
        project: default
        source:
          repoURL: https://github.com/seadogger-tech/seadogger-homelab
          targetRevision: '{{ nextcloud_postgresql_revision }}'
          path: deployments/nextcloud/postgresql
          kustomize:
            patches: >-
              {{ nc_db_application.resources[0].spec.source.kustomize.patches
                 | default([]) if nc_db_application.resources | length > 0 else [] }}
        destination:
          server: https://kubernetes.default.svc
          namespace: nextcloud
        syncPolicy:
          automated:
            prune: true
            selfHeal: true

- name: Wait for the staged database rollout
  kubernetes.core.k8s_info:
    kubeconfig: '{{ KUBECONFIG }}'
    api_version: apps/v1
    kind: StatefulSet
    namespace: nextcloud
    name: nextcloud-db
  register: nc_db_ready
  until: >-
    nc_db_ready.resources | length == 1 and
    nc_db_ready.resources[0].status.readyReplicas | default(0) == 1
  retries: 60
  delay: 10
  when: not ansible_check_mode
