---
- name: Basic Memory Deploy
  vars:
    kubeconfig_path: /etc/rancher/k3s/k3s.yaml
    basic_memory_namespace: basic-memory
    argocd_namespace: argocd
  block:
    - name: Create Basic Memory ArgoCD Application
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: present
        definition:
          apiVersion: argoproj.io/v1alpha1
          kind: Application
          metadata:
            name: basic-memory
            namespace: "{{ argocd_namespace }}"
          spec:
            project: default
            source:
              repoURL: https://github.com/seadogger-tech/seadogger-homelab
              path: deployments/basic-memory
              targetRevision: HEAD
            destination:
              server: https://kubernetes.default.svc
              namespace: "{{ basic_memory_namespace }}"
            syncPolicy:
              automated:
                prune: true
                selfHeal: true
              syncOptions:
                - CreateNamespace=true

    - name: Wait for ArgoCD Application to be Healthy
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig_path }}"
        api_version: argoproj.io/v1alpha1
        kind: Application
        name: basic-memory
        namespace: "{{ argocd_namespace }}"
      register: app
      retries: 30
      delay: 10
      until: app.resources and app.resources[0].status.health.status == "Healthy"

    - name: Print connection info
      ansible.builtin.debug:
        msg:
          - "✅ Basic Memory deployed successfully!"
          - ""
          - "🧠 Basic Memory (MCP knowledge store):"
          - "   URL: https://basic-memory.seadogger-homelab"
          - "   MCP endpoint (SSE): https://basic-memory.seadogger-homelab/sse"
          - "   Not internet-exposed — internal IngressRoute only, no built-in auth."
