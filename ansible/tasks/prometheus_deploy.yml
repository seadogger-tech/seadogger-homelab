---
# Step 1: Set KUBECONFIG globally
- name: Set KUBECONFIG global
  ansible.builtin.set_fact:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

# Step 2: Apply Prometheus CRDs
- name: Apply Prometheus CRDs
  ansible.builtin.shell: >
    kubectl apply --server-side -f https://raw.githubusercontent.com/prometheus-operator/kube-prometheus/release-0.13/manifests/setup/0alertmanagerCustomResourceDefinition.yaml &&
    kubectl apply --server-side -f https://raw.githubusercontent.com/prometheus-operator/kube-prometheus/release-0.13/manifests/setup/0podmonitorCustomResourceDefinition.yaml &&
    kubectl apply --server-side -f https://raw.githubusercontent.com/prometheus-operator/kube-prometheus/release-0.13/manifests/setup/0prometheusCustomResourceDefinition.yaml &&
    kubectl apply --server-side -f https://raw.githubusercontent.com/prometheus-operator/kube-prometheus/release-0.13/manifests/setup/0prometheusruleCustomResourceDefinition.yaml &&
    kubectl apply --server-side -f https://raw.githubusercontent.com/prometheus-operator/kube-prometheus/release-0.13/manifests/setup/0servicemonitorCustomResourceDefinition.yaml &&
    kubectl apply --server-side -f https://raw.githubusercontent.com/prometheus-operator/kube-prometheus/release-0.13/manifests/setup/0thanosrulerCustomResourceDefinition.yaml &&
    kubectl apply --server-side -f https://raw.githubusercontent.com/prometheus-operator/kube-prometheus/release-0.13/manifests/setup/0probeCustomResourceDefinition.yaml &&
    kubectl apply --server-side -f https://raw.githubusercontent.com/prometheus-operator/kube-prometheus/release-0.13/manifests/setup/0alertmanagerConfigCustomResourceDefinition.yaml

# Step 3: Wait for Prometheus CRDs to be established
- name: Wait for Prometheus CRDs to be established
  kubernetes.core.k8s_info:
    kubeconfig: "{{ KUBECONFIG }}"
    kind: CustomResourceDefinition
    name: "{{ item }}"
  register: crd_status
  until: crd_status.resources | default([]) | length > 0 and (crd_status.resources[0].status.conditions | selectattr('type', 'equalto', 'Established') | first).status == 'True'
  retries: 10
  delay: 5
  with_items:
    - alertmanagers.monitoring.coreos.com
    - podmonitors.monitoring.coreos.com
    - prometheuses.monitoring.coreos.com
    - prometheusrules.monitoring.coreos.com
    - servicemonitors.monitoring.coreos.com
    - thanosrulers.monitoring.coreos.com
    - probes.monitoring.coreos.com
    - alertmanagerconfigs.monitoring.coreos.com

# Step 4: Create Prometheus Stack ArgoCD Application
- name: Create Prometheus Stack ArgoCD Application
  ansible.builtin.k8s:
    kubeconfig: "{{ KUBECONFIG }}"
    state: present
    definition:
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: prometheus-stack
        namespace: argocd
      spec:
        project: default
        source:
          repoURL: https://github.com/prometheus-operator/kube-prometheus
          targetRevision: release-0.13
          path: manifests
        destination:
          server: https://kubernetes.default.svc
          namespace: monitoring
        # kube-prometheus ships an HA topology - 2 Prometheus, 3 Alertmanager -
        # which costs ~1.4 GiB on a 4-node Pi cluster for redundancy nobody is
        # consuming here. Replicas are dropped to 1 below.
        #
        # The upstream manifests are synced directly (no values file, and no
        # kustomization.yaml upstream to overlay), so selfHeal would revert any
        # replica change within minutes. ignoreDifferences on just that field
        # lets the scale-down stick while everything else stays managed.
        ignoreDifferences:
          - group: monitoring.coreos.com
            kind: Prometheus
            jsonPointers:
              - /spec/replicas
          - group: monitoring.coreos.com
            kind: Alertmanager
            jsonPointers:
              - /spec/replicas
        syncPolicy:
          automated:
            prune: true
            selfHeal: true
          syncOptions:
            - CreateNamespace=true

# Step 5: Wait for the 'monitoring' namespace to be created by ArgoCD
- name: Wait for monitoring namespace to exist
  kubernetes.core.k8s_info:
    kubeconfig: "{{ KUBECONFIG }}"
    kind: Namespace
    name: monitoring
  register: monitoring_ns
  until: monitoring_ns.resources | length > 0
  retries: 30
  delay: 10

# Step 5b: Scale the HA topology down to single replicas.
#
# Upstream kube-prometheus runs 2 Prometheus + 3 Alertmanager. On this cluster
# that is ~1.4 GiB of RAM for redundancy of metrics nobody consumes, on nodes
# that need the headroom for Ceph OSDs and mons. Measured before/after:
# monitoring namespace 3193 MiB -> 1771 MiB.
#
# Paired with ignoreDifferences on the Application above - without that, ArgoCD
# selfHeal reverts these within minutes. prometheus-adapter is deliberately left
# alone: it serves v1beta1.metrics.k8s.io, which is what `kubectl top` and any
# HPA read. It only costs ~91 MiB and removing it would hand that API back to
# kube-system/metrics-server, which is a needless risk for the saving.
- name: Scale Prometheus and Alertmanager to single replicas
  kubernetes.core.k8s:
    kubeconfig: "{{ KUBECONFIG }}"
    state: patched
    api_version: monitoring.coreos.com/v1
    kind: "{{ item.kind }}"
    name: "{{ item.name }}"
    namespace: monitoring
    definition:
      spec:
        replicas: 1
  loop:
    - { kind: "Prometheus", name: "k8s" }
    - { kind: "Alertmanager", name: "main" }
  loop_control:
    label: "{{ item.kind }}/{{ item.name }} -> replicas=1"
  retries: 10
  delay: 15
  register: prom_scale
  until: prom_scale is succeeded

# Step 6: Create LoadBalancer Services
- name: Create Prometheus LoadBalancer Service
  ansible.builtin.k8s:
    kubeconfig: "{{ KUBECONFIG }}"
    state: present
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: prometheus-k8s-lb
        namespace: monitoring
      spec:
        type: LoadBalancer
        loadBalancerIP: "192.168.1.244"
        ports:
        - port: 9090
          targetPort: 9090
          protocol: TCP
        selector:
          app.kubernetes.io/name: prometheus
          prometheus: k8s

- name: Create Grafana LoadBalancer Service
  ansible.builtin.k8s:
    kubeconfig: "{{ KUBECONFIG }}"
    state: present
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: grafana-lb
        namespace: monitoring
      spec:
        type: LoadBalancer
        loadBalancerIP: "192.168.1.245"
        ports:
        - port: 3000
          targetPort: 3000
          protocol: TCP
        selector:
          app.kubernetes.io/name: grafana

- name: Create Alertmanager LoadBalancer Service
  ansible.builtin.k8s:
    kubeconfig: "{{ KUBECONFIG }}"
    state: present
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: alertmanager-main-lb
        namespace: monitoring
      spec:
        type: LoadBalancer
        loadBalancerIP: "192.168.1.246"
        ports:
        - port: 9093
          targetPort: 9093
          protocol: TCP
        selector:
          app.kubernetes.io/name: alertmanager
          alertmanager: main

# Step 6: Create Network Policies for External Access
- name: Create Prometheus External Access Network Policy
  ansible.builtin.k8s:
    kubeconfig: "{{ KUBECONFIG }}"
    state: present
    definition:
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: allow-prometheus-external
        namespace: monitoring
      spec:
        podSelector:
          matchLabels:
            app.kubernetes.io/name: prometheus
        policyTypes:
          - Ingress
        ingress:
          - ports:
              - port: 9090

- name: Create Grafana External Access Network Policy
  ansible.builtin.k8s:
    kubeconfig: "{{ KUBECONFIG }}"
    state: present
    definition:
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: allow-grafana-external
        namespace: monitoring
      spec:
        podSelector:
          matchLabels:
            app.kubernetes.io/name: grafana
        policyTypes:
          - Ingress
        ingress:
          - ports:
              - port: 3000

- name: Create Alertmanager External Access Network Policy
  ansible.builtin.k8s:
    kubeconfig: "{{ KUBECONFIG }}"
    state: present
    definition:
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: allow-alertmanager-external
        namespace: monitoring
      spec:
        podSelector:
          matchLabels:
            app.kubernetes.io/name: alertmanager
        policyTypes:
          - Ingress
        ingress:
          - ports:
              - port: 9093

# Step 7: Wait for Prometheus Stack to be healthy
- name: Wait for prometheus-stack ArgoCD app to be healthy
  kubernetes.core.k8s_info:
    kubeconfig: "{{ KUBECONFIG }}"
    api_version: argoproj.io/v1alpha1
    kind: Application
    namespace: argocd
    name: prometheus-stack
  register: prometheus_status
  until: >
    prometheus_status.resources | default([]) | length > 0 and
    (prometheus_status.resources[0].status | default({})).get('health', {}).get('status', '') == 'Healthy'
  retries: 60
  delay: 10
