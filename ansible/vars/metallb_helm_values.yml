---
# Helm values for the MetalLB release. Shared by tasks/metallb_native_deploy.yml
# (cold start) and tasks/metallb_resources.yml (enable_metallb_resources), so a
# helm upgrade from either one renders the same release - each run replaces the
# release values rather than merging them.
#
# Resource requests are set deliberately, and not for capacity reasons.
#
# The MetalLB chart ships no requests, which makes every speaker and the
# controller QoS class BestEffort - the first thing the kubelet evicts when a
# node runs out of memory, ahead of whatever actually caused the pressure.
# Losing all four speakers means losing LoadBalancer announcement for every
# service in the cluster, including Pi-hole's DNS on 192.168.1.250, which the
# nodes themselves resolve through.
#
# Requests move them out of BestEffort so they are no longer first in line;
# Stage B1 below makes them Guaranteed.
#
# Stage B0 (OCE-369): limits were cut to 1.25 x the memory.peak read over 7+
# days (OCE-550); requests never went up.
#
# Stage B1 (OCE-369): every container is Guaranteed: memory and CPU request =
# limit, at 1.25 x its measured peak P rounded up to 8Mi (the sizing rule in
# docs/wiki/30-Cluster-Resource-Monitor.md; the per-container table is in the
# private Pro docs/operations/memory-sizing.md). No request is below P and no
# limit is above the B0 one. The three init containers (cp-frr-files,
# cp-reloader, cp-metrics) take their size from the metallb-system LimitRange,
# which has to carry equal defaults before a speaker is recreated, or the pod
# stays Burstable.
# CPU request = limit follows OCE-706 spec §3.1; the measured per-node table is
# on the OCE-709 ticket and the reviewed sizing record is in Pro.
#
# The speaker DaemonSet uses OnDelete, not RollingUpdate. RollingUpdate moves
# on as soon as a replacement is available and never looks at the network;
# a speaker that cannot announce its Services is an outage for the whole
# cluster. With OnDelete, `helm upgrade` changes the template and replaces no
# speaker; tasks/metallb_speaker_replace.yml then replaces them one at a time
# and checks every LoadBalancer Service before the next deletion.
metallb_helm_values:
  controller:
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: NotIn
                  values: [rey.local]
    resources:
      requests:
        cpu: 50m
        memory: 152Mi
      limits:
        cpu: 50m
        memory: 152Mi
  speaker:
    updateStrategy:
      type: OnDelete
    resources:
      requests:
        cpu: 100m
        memory: 88Mi
      limits:
        cpu: 100m
        memory: 88Mi
    frr:
      resources:
        requests:
          cpu: 125m
          memory: 64Mi
        limits:
          cpu: 125m
          memory: 64Mi
    reloader:
      resources:
        requests:
          cpu: 125m
          memory: 64Mi
        limits:
          cpu: 125m
          memory: 64Mi
    frrMetrics:
      resources:
        requests:
          cpu: 275m
          memory: 48Mi
        limits:
          cpu: 275m
          memory: 48Mi
