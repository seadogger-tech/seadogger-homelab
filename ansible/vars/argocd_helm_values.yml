---
# Helm values for the ArgoCD release. Shared by tasks/argocd_native_deploy.yml
# (cold start) and tasks/argocd_resources.yml (enable_argocd_resources). Each
# helm run replaces the release values rather than merging them, so every run
# must carry the same values.
argocd_helm_values:
  server:
    service:
      type: ClusterIP
    resources:
      requests:
        memory: 64Mi
      limits:
        memory: 184Mi  # peak 146.5Mi (Stage B0, OCE-369)
  # Behind Traefik's TLS termination. Set here as well as by the patch
  # tasks in argocd_native_deploy.yml, because a helm upgrade rewrites these
  # ConfigMaps and a values-less upgrade put server.insecure back to false
  # (2026-10-31).
  configs:
    params:
      server.insecure: true
    cm:
      url: https://argocd.seadogger-homelab
  controller:
    # The application controller had no resources and fell back to the
    # namespace LimitRange default (64Mi) while using ~350Mi, 606Mi peak
    # (2026-10-31), so every node it landed on was under-counted.
    resources:
      requests:
        cpu: 100m
        memory: 384Mi  # below the 631.5Mi peak; raising it is Stage B
      limits:
        memory: 792Mi  # was 1Gi (Stage B0, OCE-369)
  # Stage B0 (OCE-369): these components had no resources and took the argocd
  # LimitRange (64Mi request, 1Gi limit). Requests stay at that 64Mi (redis
  # drops to 32Mi); limits are 1.25 x the 15+ day memory.peak. CPU still comes
  # from the LimitRange, so only memory is set.
  repoServer:
    resources:
      requests:
        memory: 64Mi
      limits:
        memory: 408Mi  # peak 321.0Mi
  dex:
    resources:
      requests:
        memory: 64Mi
      limits:
        memory: 160Mi  # peak 124.2Mi
  notifications:
    resources:
      requests:
        memory: 64Mi
      limits:
        memory: 88Mi   # peak 69.7Mi
  applicationSet:
    resources:
      requests:
        memory: 64Mi
      limits:
        memory: 80Mi   # peak 63.5Mi
  redis:
    resources:
      requests:
        memory: 32Mi   # was 64Mi
      limits:
        memory: 40Mi   # peak 15.4Mi
