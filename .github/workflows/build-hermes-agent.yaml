name: Build hermes-agent

# Hermes needs a custom image (SSH server, homelab dev tooling, Signal
# attachment patch) layered on nousresearch/hermes-agent; the upstream image
# alone does not provide them.
#
# The image tag is deterministic: base-<upstream arm64 manifest digest>-src-<hash
# of the build inputs in this repo>. GHCR is asked whether that tag exists; if
# so the run is a successful skip, if genuinely absent it builds and pushes.
# Registry errors fail the run rather than being read as "absent". Nothing is
# written back to the repository.

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/build-hermes-agent.yaml
      - .github/scripts/ghcr_tag_exists.sh
      - deployments/hermes/**
      - .dockerignore
      - useful_scripts/hermes/patch_signal_attachments.py
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch:        # allow manual run
    inputs:
      force_rebuild:
        description: "Rebuild/push even if the image tag already exists (also needed for the first-ever publish of a new package)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write           # push to GHCR

concurrency:
  group: build-hermes-agent
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/seadogger-tech/hermes-agent
  IMAGE_REPO: seadogger-tech/hermes-agent
  UPSTREAM_IMAGE: docker.io/nousresearch/hermes-agent

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Get upstream arm64 digest
        id: upstream
        run: |
          DIGESTS=$(curl -fsSL \
            "https://hub.docker.com/v2/repositories/nousresearch/hermes-agent/tags/latest" \
            | jq -r '[.images[] | select(.architecture=="arm64" and .os=="linux") | .digest] | unique | .[]')
          if [[ $(wc -l <<<"$DIGESTS") -ne 1 || ! "$DIGESTS" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Expected exactly one linux/arm64 digest for nousresearch/hermes-agent:latest, got: '${DIGESTS}'"
            exit 1
          fi
          echo "digest=${DIGESTS}" >> "$GITHUB_OUTPUT"
          echo "Upstream arm64 digest: ${DIGESTS}"

      - name: Compute image tag
        id: tag
        run: |
          SRC=$(sha256sum \
            .dockerignore \
            useful_scripts/hermes/patch_signal_attachments.py \
            $(find deployments/hermes -type f | LC_ALL=C sort) \
            | sha256sum | cut -c1-12)
          BASE="${{ steps.upstream.outputs.digest }}"
          TAG="base-${BASE#sha256:}"
          TAG="${TAG:0:17}-src-${SRC}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Image tag: ${TAG}"

      - name: Check GHCR for this image
        id: exists
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: .github/scripts/ghcr_tag_exists.sh "$IMAGE_REPO" "${{ steps.tag.outputs.tag }}"

      - name: Decide whether to build
        id: plan
        run: |
          if [[ "${{ github.event.inputs.force_rebuild }}" == "true" ]]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "force_rebuild=true; rebuilding ${{ steps.tag.outputs.tag }}."
          elif [[ "${{ steps.exists.outputs.exists }}" == "false" ]]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "${IMAGE}:${{ steps.tag.outputs.tag }} is absent; building."
          elif [[ "${{ steps.exists.outputs.exists }}" == "true" ]]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "${IMAGE}:${{ steps.tag.outputs.tag }} already exists; skipping build."
          else
            echo "::error::GHCR check produced no usable result"
            exit 1
          fi

      - name: Setup QEMU
        if: steps.plan.outputs.build == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Setup Buildx
        if: steps.plan.outputs.build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: steps.plan.outputs.build == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push (arm64)
        if: steps.plan.outputs.build == 'true'
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployments/hermes/Dockerfile
          platforms: linux/arm64
          push: true
          # Pin the Dockerfile's `FROM ...hermes-agent:latest` to the exact
          # arm64 digest the tag was computed from.
          build-contexts: |
            ${{ env.UPSTREAM_IMAGE }}:latest=docker-image://${{ env.UPSTREAM_IMAGE }}@${{ steps.upstream.outputs.digest }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=hermes-agent with homelab dev tooling and SSH server
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.base.digest=${{ steps.upstream.outputs.digest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report immutable image digest
        if: steps.plan.outputs.build == 'true'
        run: echo "Built ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}"
