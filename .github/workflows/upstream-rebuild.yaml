name: Rebuild from aws-samples on change

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch:        # allow manual run

permissions:
  contents: write           # commit .github/upstream_sha
  packages: write           # push to GHCR

concurrency:
  group: upstream-rebuild-bedrock
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/seadogger-tech/aws-bedrock-gateway

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      # Checkout this repo (to read/write .github/upstream_sha)
      - name: Checkout this repo (master)
        uses: actions/checkout@v4
        with:
          ref: master          # change to 'main' if needed
          fetch-depth: 0

      # Checkout upstream repo (default branch)
      - name: Checkout upstream aws-samples/bedrock-access-gateway
        uses: actions/checkout@v4
        with:
          repository: aws-samples/bedrock-access-gateway
          path: upstream
          fetch-depth: 0

      # Check whether any PR we cherry-pick below has been merged/closed
      # upstream yet. This does NOT stop the build — it just surfaces a loud
      # warning so a human notices and removes the now-unnecessary cherry-pick
      # step, instead of it silently sitting there forever (a no-op once the
      # change is already in main) or failing quietly on a future conflict.
      - name: Check adopted-PR status (all cherry-picked PRs)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for PR in 255 246 247 239 198 249; do
            STATE=$(gh pr view "$PR" --repo aws-samples/bedrock-access-gateway --json state --jq .state)
            echo "PR #$PR state: $STATE"
            if [[ "$STATE" != "OPEN" ]]; then
              echo "::warning::aws-samples/bedrock-access-gateway#$PR is now $STATE upstream. The matching cherry-pick step below is likely no longer needed — remove it. See core/docs/wiki/09-Apps.md#adopting-unmerged-upstream-prs-a-reusable-pattern."
            fi
          done

      # TEMPORARY: cherry-pick 6 not-yet-merged PRs on top of upstream main.
      # Covers two real, active clients of this gateway:
      #   - Mealie (recipe AI import/parsing) needs #255 for schema-enforced
      #     structured output — without it, models free-text their own JSON
      #     style and break strict parsers.
      #   - OpenWebUI (interactive chat, confirmed connected at
      #     192.168.1.242:6880) needs the rest for tool/function-calling
      #     reliability and newer-model support, even though Tools aren't
      #     enabled today — these fix hard failures the moment they are:
      #       #246 - drop orphan tool_use/tool_result pairs (explicitly
      #              reproduces an OpenWebUI history-rewrite scenario)
      #       #247 - fix negative tool-call indexes in streamed responses
      #       #239 - allow replayed tool blocks without a `tools` array
      #              (conversation compaction/summarization)
      #       #198 - return tool_calls instead of dropping them when a
      #              response is truncated by max_tokens
      #       #249 - Claude Opus 4.7 adaptive-thinking request format
      #              (Opus 4.7 is already selectable in OpenWebUI's model
      #              list; reasoning requests to it fail without this)
      #
      # Two of these conflict with each other in a small, known way — both
      # #255 and #239 add a branch in the same spot in _parse_request, and
      # #198 and #239 both touch the same log line. Conflicts are resolved
      # by .github/scripts/resolve_bedrock_gateway_conflicts.py (tested
      # locally against a fresh checkout before being adopted here) rather
      # than inline, since embedding Python heredocs directly in this YAML's
      # `run:` block is fragile and hard to validate. If a future upstream
      # change touches the same region of src/api/models/bedrock.py, that
      # script's patterns may need updating — it fails loudly rather than
      # silently doing nothing if its expected conflict shape isn't found.
      #
      # Remove each cherry-pick individually once its PR merges upstream.
      # See: core/docs/wiki/09-Apps.md#adopting-unmerged-upstream-prs-a-reusable-pattern
      - name: Cherry-pick unmerged PRs (#255, #246, #247, #239, #198, #249)
        id: patch
        run: |
          cd upstream
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          pick() {
            local remote_url="$1" branch="$2" pr="$3"
            git remote add "pr$pr" "$remote_url" 2>/dev/null || true
            git fetch "pr$pr" "$branch"
            local sha
            sha="$(git rev-parse "pr$pr/$branch")"
            if ! git cherry-pick "$sha"; then
              echo "::error::Cherry-pick of PR #$pr ($sha) failed — likely diverged from upstream main or conflicts with an earlier cherry-pick in this list. Needs manual rebase; see workflow comments."
              git cherry-pick --abort
              exit 1
            fi
          }

          # PRs with clean, conflict-free cherry-picks
          pick https://github.com/nijave/bedrock-access-gateway.git nv-response-format 255
          pick https://github.com/marcoruizrueda/bedrock-access-gateway.git fix/sanitize-orphan-tool-pairs 246
          pick https://github.com/bokmann/bedrock-access-gateway.git fix/stream-tool-call-index 247

          # #239 - KNOWN CONFLICT with #255 (both add a branch in
          # _parse_request). Resolved via resolve_bedrock_gateway_conflicts.py.
          git remote add pr239 https://github.com/rwestergren/bedrock-access-gateway.git 2>/dev/null || true
          git fetch pr239 fix-toolconfig-replayed-tool-blocks
          PR239_SHA="$(git rev-parse pr239/fix-toolconfig-replayed-tool-blocks)"
          if ! git cherry-pick "$PR239_SHA"; then
            python3 ../.github/scripts/resolve_bedrock_gateway_conflicts.py 239
            git add src/api/models/bedrock.py
            git -c core.editor=true cherry-pick --continue
          fi

          # #198 - KNOWN CONFLICT with #239 (both touch the same log line).
          # Resolved via resolve_bedrock_gateway_conflicts.py.
          git remote add pr198 https://github.com/azriel-healthpoint/bedrock-access-gateway.git 2>/dev/null || true
          git fetch pr198 bugfix/197/return-tool-use-on-max-tokens-finish-reason
          PR198_SHA="$(git rev-parse pr198/bugfix/197/return-tool-use-on-max-tokens-finish-reason)"
          if ! git cherry-pick "$PR198_SHA"; then
            python3 ../.github/scripts/resolve_bedrock_gateway_conflicts.py 198
            git add src/api/models/bedrock.py
            git -c core.editor=true cherry-pick --continue
          fi

          pick https://github.com/bszadkowski/bedrock-access-gateway.git feat/opus-47-adaptive-thinking 249

          python3 -c "import ast; ast.parse(open('src/api/models/bedrock.py').read())" || {
            echo "::error::src/api/models/bedrock.py has invalid Python syntax after all cherry-picks — build would fail. Manual review needed."
            exit 1
          }

      - name: Compute upstream SHA
        id: sha
        run: |
          NEW_SHA=$(git -C upstream rev-parse HEAD)
          SHORT=$(git -C upstream rev-parse --short HEAD)
          echo "new_sha=$NEW_SHA"   >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT"   >> "$GITHUB_OUTPUT"
          echo "Upstream SHA (incl. cherry-picked #255/#246/#247/#239/#198/#249): $NEW_SHA"

      - name: Load last built SHA (if any)
        id: last
        run: |
          if [[ -f ".github/upstream_sha" ]]; then
            echo "last_sha=$(cat .github/upstream_sha)" >> "$GITHUB_OUTPUT"
          else
            echo "last_sha=" >> "$GITHUB_OUTPUT"
          fi

      - name: Decide if changed
        id: changed
        run: |
          if [[ "${{ steps.sha.outputs.new_sha }}" == "${{ steps.last.outputs.last_sha }}" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No upstream change; skipping build."
          else
            echo "changed=true"  >> "$GITHUB_OUTPUT"
            echo "Upstream changed to ${{ steps.sha.outputs.new_sha }}; building…"
          fi

      - name: Setup QEMU (for multi-arch emulation)
        if: steps.changed.outputs.changed == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Setup Buildx
        if: steps.changed.outputs.changed == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: steps.changed.outputs.changed == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push (amd64 + arm64)
        if: steps.changed.outputs.changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./upstream/src
          file: ./upstream/src/Dockerfile_ecs
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ steps.sha.outputs.short_sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=Auto-built from aws-samples/bedrock-access-gateway main + cherry-picked #255/#246/#247/#239/#198/#249 @ ${{ steps.sha.outputs.new_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save upstream SHA for next run
        if: steps.changed.outputs.changed == 'true'
        run: |
          echo "${{ steps.sha.outputs.new_sha }}" > .github/upstream_sha
          # Also update deployment to trigger ArgoCD sync
          echo "# Auto-updated: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> deployments/bedrock-access-gateway/bedrock-access-gateway-deployment.yaml
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/upstream_sha deployments/bedrock-access-gateway/bedrock-access-gateway-deployment.yaml
          git commit -m "ci(upstream): ${{ steps.sha.outputs.new_sha }}"
          # A human commit to master while this build was running makes a
          # plain `git push` fail with "fetch first". Retry with a rebase a
          # few times before giving up — this step only updates tracking
          # files, so rebasing onto newer master is safe.
          for attempt in 1 2 3 4 5; do
            if git push; then
              break
            fi
            echo "Push rejected (attempt $attempt/5) — pulling and rebasing before retry..."
            git pull --rebase origin master
            if [ "$attempt" = "5" ]; then
              echo "::error::Failed to push .github/upstream_sha after 5 attempts. The image was still built and pushed successfully — only this tracking commit failed. Push manually or re-run the workflow."
              exit 1
            fi
          done
