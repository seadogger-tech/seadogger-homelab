name: Check and Publish Wiki

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: wiki-publish-${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-wiki:
    if: github.repository == 'seadogger-tech/seadogger-homelab'
    runs-on: ubuntu-latest
    env:
      GIT_TERMINAL_PROMPT: '0'
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test wiki preflight
        run: python3 -B -m unittest discover -s useful_scripts/wiki -p 'test_*.py'
      - name: Compare source with live wiki
        run: python3 -B useful_scripts/wiki/preflight.py

  publish-wiki:
    needs: check-wiki
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch && github.repository == 'seadogger-tech/seadogger-homelab'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GIT_TERMINAL_PROMPT: '0'
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Clone wiki
        run: git clone https://github.com/seadogger-tech/seadogger-homelab.wiki.git wiki

      - name: Stage and recheck reviewed payload
        run: python3 -B useful_scripts/wiki/preflight.py --published wiki --payload wiki-payload

      - name: Sync pages and rendered images
        run: rsync -a --delete --exclude '.git/' wiki-payload/ wiki/

      - name: Commit & push (to wiki repo)
        working-directory: wiki
        run: |
          gh auth setup-git
          git config user.name "SeaDogger Wiki Bot"
          git config user.email "wiki-bot@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "Publish reviewed wiki source"
            git push origin HEAD:master
          else
            echo "No changes to publish."
          fi

      - name: Verify published default branch and content
        run: |
          git -C wiki fetch --quiet origin master
          test "$(git -C wiki rev-parse HEAD)" = "$(git -C wiki rev-parse origin/master)"
          test -z "$(rsync -a --delete --dry-run --itemize-changes --exclude '.git/' wiki-payload/ wiki/)"
