name: Rebuild from AsamK/signal-cli on new release

# Builds and publishes ghcr.io/seadogger-tech/signal-cli for the
# seadogger-homelab-pro signal-cli pod. The Dockerfile + workflow live in the
# public core repo because they only package public components
# (eclipse-temurin base + AsamK upstream signal-cli tarball) - building from a
# public repo means new GHCR packages inherit public visibility automatically.
#
# A custom build is still needed: AsamK's own ghcr.io/asamk/signal-cli image is
# linux/amd64 only, so it cannot run on the arm64 nodes.
#
# What this does:
#   1. Every 6h check AsamK/signal-cli for the latest release tag
#   2. Ask GHCR whether ghcr.io/seadogger-tech/signal-cli:<version> exists
#   3. If it does, stop (successful skip). If it is genuinely absent, build and
#      push multi-arch <version> + :latest. Registry errors fail the run
#      instead of being read as "absent".
# Nothing is written to the repository, so branch protection is not involved.
# The image tag in pro is bumped manually by the operator when ready to roll out.

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: "Rebuild/push the current upstream tag even if the image already exists"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: upstream-rebuild-signal-cli
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/seadogger-tech/signal-cli
  IMAGE_REPO: seadogger-tech/signal-cli
  UPSTREAM_REPO: AsamK/signal-cli

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Query latest upstream release tag
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NEW_TAG=$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${UPSTREAM_REPO}/releases/latest" \
            | jq -er '.tag_name')
          VERSION="${NEW_TAG#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+(\.[0-9]+)+$ ]]; then
            echo "::error::Unexpected upstream release tag '${NEW_TAG}'"
            exit 1
          fi
          echo "new_tag=$NEW_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Upstream latest tag: $NEW_TAG (version=$VERSION)"

      - name: Check GHCR for this version
        id: exists
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: .github/scripts/ghcr_tag_exists.sh "$IMAGE_REPO" "${{ steps.tag.outputs.version }}"

      - name: Decide whether to build
        id: plan
        run: |
          if [[ "${{ github.event.inputs.force_rebuild }}" == "true" ]]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "force_rebuild=true; rebuilding ${{ steps.tag.outputs.version }}."
          elif [[ "${{ steps.exists.outputs.exists }}" == "false" ]]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "${IMAGE}:${{ steps.tag.outputs.version }} is absent; building."
          elif [[ "${{ steps.exists.outputs.exists }}" == "true" ]]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "${IMAGE}:${{ steps.tag.outputs.version }} already exists; skipping build."
          else
            echo "::error::GHCR check produced no usable result"
            exit 1
          fi

      - name: Setup QEMU (for multi-arch emulation)
        if: steps.plan.outputs.build == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Setup Buildx
        if: steps.plan.outputs.build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: steps.plan.outputs.build == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push (amd64 + arm64)
        if: steps.plan.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: deployments/signal-cli
          file: deployments/signal-cli/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.tag.outputs.version }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.version }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=AsamK/signal-cli ${{ steps.tag.outputs.new_tag }} daemon for k8s
            org.opencontainers.image.version=${{ steps.tag.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
