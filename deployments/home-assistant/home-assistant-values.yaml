fullnameOverride: home-assistant

image:
  repository: ghcr.io/home-assistant/home-assistant
  # Chart appVersion tracks upstream HA releases; pin explicitly rather than
  # trailing "latest" (see hermes-agent in deployments/hermes for what that
  # costs when an upstream image quietly changes behavior underneath you).
  tag: "2026.7.0"

replicaCount: 1

# hostNetwork required for mDNS/SSDP auto-discovery (Apple TV, UniFi,
# Chromecast, HomeKit) - those rely on LAN multicast, which never reaches a
# pod behind the normal CNI overlay regardless of Service type (a
# ClusterIP/LoadBalancer only proxies unicast traffic to a stable address,
# it can't bridge multicast onto the pod's network namespace). Pinned to
# yoda via nodeSelector below so HA's real IP (yoda's 192.168.1.95) stays
# stable across restarts instead of following whichever node it lands on.
hostNetwork: true
# Required when hostNetwork is true - otherwise the pod loses in-cluster
# DNS resolution (e.g. pihole-web.pihole.svc.cluster.local) while gaining
# LAN access, per the chart's own values.yaml comment.
dnsPolicy: ClusterFirstWithHostNet

nodeSelector:
  kubernetes.io/hostname: yoda

service:
  type: ClusterIP
  port: 8080

persistence:
  enabled: true
  storageClass: ceph-block-data
  accessMode: ReadWriteOnce
  size: 10Gi

resources:
  requests:
    cpu: "100m"
    memory: "512Mi"
  limits:
    cpu: "1000m"
    memory: "1Gi"

ingress:
  enabled: false
  # We terminate TLS and route via our own Traefik IngressRoute
  # (ingressroutes.yaml), not this chart's Ingress resource. external:true
  # only tells the chart's templated configuration.yaml to trust the
  # reverse proxy (emits http.use_x_forwarded_for + trusted_proxies) -
  # it creates no Ingress object of its own. Without this, HA rejects
  # every request from Traefik's pod IP with "not set-up for reverse
  # proxies" (400 Bad Request).
  external: true

configuration:
  enabled: true

# Trust our internal CA for outbound HTTPS calls HA makes to other apps'
# *.seadogger-homelab ingress hostnames (e.g. the Nextcloud integration) -
# the base image only ships the standard public CA list, which has never
# heard of our private CA. internal-root-ca-cert-only (a cert-only Secret,
# no private key - see ansible/tasks/internal_pki_deploy.yml) is mounted
# read-only and merged with the image's existing CA bundle by an
# initContainer, since the main container's /etc/ssl/certs needs to be
# writable for update-ca-certificates but the base image build shouldn't
# be modified directly.
additionalVolumes:
  - name: internal-ca-cert
    secret:
      secretName: internal-root-ca-cert-only
  - name: ssl-certs
    emptyDir: {}

initContainers:
  # Do not let Home Assistant start until DNS actually works.
  #
  # Integrations that authenticate at startup fail PERMANENTLY if DNS is
  # not yet available and never retry -- the config entry just sits dead
  # until HA is restarted by hand. The ecobee integration does exactly
  # this: it refreshes an OAuth token against auth.ecobee.com within
  # ~25s of startup, and on NameResolutionError it gives up for good.
  #
  # This bites on every power event, because HA races Pi-hole on the way
  # back up. CoreDNS forwards only to Pi-hole (deliberately -- it stops
  # pods bypassing DNS filtering, see core#59), so while Pi-hole is still
  # starting, pods have no resolution at all. Hit twice: 2026-08-04 and
  # again 2026-08-07 during the brownout cycling.
  #
  # Fails OPEN: after ~5 minutes it starts HA regardless, so a genuine
  # DNS outage degrades HA rather than preventing it from running at all.
  - name: wait-for-dns
    image: busybox:1.37
    command: ["/bin/sh", "-c"]
    args:
      - |
        for i in $(seq 1 60); do
          if nslookup "${DNS_CANARY:-github.com}" >/dev/null 2>&1; then
            echo "DNS ready after $((i*5))s"
            exit 0
          fi
          echo "waiting for DNS ($i/60)"
          sleep 5
        done
        echo "WARNING: DNS still unresolvable after 5m - starting anyway"
        exit 0
    env:
      - name: DNS_CANARY
        value: "github.com"
    resources:
      requests:
        cpu: "10m"
        memory: "16Mi"
      limits:
        cpu: "100m"
        memory: "64Mi"

  - name: trust-internal-ca
    image: ghcr.io/home-assistant/home-assistant:2026.7.0
    command: ["/bin/sh", "-c"]
    args:
      - |
        set -e
        cp -a /etc/ssl/certs/. /ssl-certs-out/
        cp /internal-ca-cert/root-ca.crt /ssl-certs-out/internal-root-ca.pem
        cat /internal-ca-cert/root-ca.crt >> /ssl-certs-out/ca-certificates.crt
    volumeMounts:
      - name: internal-ca-cert
        mountPath: /internal-ca-cert
        readOnly: true
      - name: ssl-certs
        mountPath: /ssl-certs-out

additionalMounts:
  - name: ssl-certs
    mountPath: /etc/ssl/certs
