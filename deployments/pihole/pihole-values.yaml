# Service configuration for web admin
image:
  tag: "2026.02.0"
  architecture: arm64

# Service configuration for web admin (via Traefik only)
serviceWeb:
  type: ClusterIP
  externalTrafficPolicy: Cluster
  # NOTE: removed 'loadBalancerIP: 192.168.1.249'
  # The Service name created by this chart is typically 'pihole-web'.

# DNS service configuration
serviceDns:
  loadBalancerIP: 192.168.1.250
  type: LoadBalancer
  externalTrafficPolicy: Local
  annotations:
    # This sharing key is what puts pihole-dns-tcp and pihole-dns-udp on the
    # SAME LoadBalancer IP. DNS needs TCP and UDP on port 53 at one address,
    # and Kubernetes will not put both protocols in a single Service here.
    # Lose the key and MetalLB hands them separate IPs, breaking resolution on
    # one protocol - which takes the cluster's DNS with it, since nodes resolve
    # through Pi-hole.
    #
    # Migrating prefix: metallb.universe.tf/* is deprecated in MetalLB 0.15
    # ("Support might get removed in future versions"). Both are set during the
    # transition so MetalLB never sees the two Services as unshared; the
    # deprecated one is removed in a follow-up once the new key is confirmed.
    metallb.universe.tf/allow-shared-ip: "pihole-shared-ip"
    metallb.io/allow-shared-ip: "pihole-shared-ip"

# DHCP service configuration
serviceDHCP:
  enabled: false

# DNS over HTTPS configuration
doh:
  enabled: true
  # PINNED + IfNotPresent -- do not revert to `latest`/`Always`.
  #
  # This sidecar is Pi-hole's ONLY upstream (FTLCONF_dns_upstreams=
  # 127.0.0.1#5053), and every cluster node resolves DNS via Pi-hole's
  # LoadBalancer. With `Always`, kubelet must reach Docker Hub on every
  # container start even when the image is already cached locally --
  # which needs DNS, which needs this container. The 2026-08-04 power
  # failure deadlocked exactly there and took the whole house offline
  # until nodes were given a temporary resolver over SSH.
  #
  # 2025.9.1 is byte-identical to the `latest` that was running
  # (sha256:9b4e856d18f6f6367330c56d91452f5fe3b6bd235f1210dcd9f6bd7373cad9be),
  # so this pin is a no-op for behaviour. Bump deliberately.
  #
  # NOTE: this alone does NOT fully close the deadlock -- a pod that
  # reschedules onto a node with no cached copy still needs a pull. See
  # core#59 / Roadmap Priority 9 for the node-DNS fix that does.
  repository: "crazymax/cloudflared"
  tag: "2025.9.1"
  pullPolicy: IfNotPresent
  # DOH_UPSTREAM was a NO-OP -- the image never reads that name, so cloudflared
  # ran on its built-in defaults (1.1.1.1 + 1.0.0.1) with no --upstream flag on
  # the command line. The correct variable is TUNNEL_DNS_UPSTREAM.
  #
  # Those defaults look like redundancy but are the SAME PROVIDER on the same
  # anycast network, so they fail together -- which is exactly what happened on
  # 2026-08-10: both Cloudflare addresses unreachable for 13m33s, taking house
  # DNS with them.
  #
  # Listing three independent operators means a single provider outage costs a
  # retry instead of the house. IPs are used deliberately rather than hostnames
  # (dns.quad9.net, dns.google): a hostname would need DNS resolved before it
  # could serve DNS, which is the bootstrap deadlock this is meant to survive.
  # Verified 2026-08-10 that all three certs carry IP SANs for these addresses
  # and answer RFC 8484 wire-format POSTs with HTTP 200.
  envVars: {
    TUNNEL_DNS_UPSTREAM: "https://1.1.1.1/dns-query,https://9.9.9.9/dns-query,https://8.8.8.8/dns-query"
  }

  # Probes must NOT gate on upstream reachability.
  #
  # The chart default for BOTH probes is
  #   nslookup -po=5053 cloudflare.com 127.0.0.1
  # which only succeeds if Cloudflare is reachable. That turns any upstream
  # blip into a total house outage, twice over:
  #
  #   readiness fails -> the pod leaves the Service endpoints -> the MetalLB
  #     VIP 192.168.1.250 has NO backend. Pi-hole is still running and could
  #     answer thousands of cached queries, but nothing can reach it.
  #   liveness fails  -> kubelet restarts cloudflared every 100s
  #     (failureThreshold 10 x period 10s), and each restart drops in-flight
  #     queries. Restarting cannot fix an unreachable upstream.
  #
  # 2026-08-10: Cloudflare DoH was unreachable for 13m33s (01:02:12 ->
  # 01:15:45Z, 5,628 errors, both 1.1.1.1 and 1.0.0.1). cloudflared was
  # killed 10 times and the entire house lost DNS - not because Pi-hole
  # failed, but because the probes removed it from service.
  #
  # A TCP check on 5053 detects the only failure a restart can actually
  # repair: the process being dead or wedged and not listening. cloudflared
  # listens on both tcp and udp 5053 (verified), so this is a valid check.
  # Upstream outages now degrade DNS to cache-only instead of removing it.
  probes:
    liveness:
      enabled: true
      probe:
        # exec: null is required - Helm deep-merges values, so without it the
        # chart's default nslookup handler survives and the rendered probe has
        # BOTH exec and tcpSocket, which the API server rejects.
        exec: null
        tcpSocket:
          port: 5053
      initialDelaySeconds: 60
      failureThreshold: 6      # 60s of a dead socket before restarting
      timeoutSeconds: 5
    readiness:
      enabled: true
      probe:
        exec: null
        tcpSocket:
          port: 5053
      initialDelaySeconds: 60
      failureThreshold: 3
      timeoutSeconds: 5

persistentVolumeClaim:
  enabled: true
  size: 10Gi
  storageClass: "ceph-block-data"

# Basic resource configuration
resources:
  limits:
    cpu: 500m
    memory: 1Gi
  requests:
    cpu: 100m
    memory: 256Mi

