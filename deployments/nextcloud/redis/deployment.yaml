---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud-redis
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: nextcloud-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nextcloud-redis
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        runAsNonRoot: true
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/arch
                    operator: In
                    values: [arm64]
                  - key: kubernetes.io/hostname
                    operator: In
                    values: [anakin.local, obiwan.local, rey.local]
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: [anakin.local]
      containers:
        - name: redis
          image: docker.io/library/redis:7.4.11-bookworm@sha256:4fa24486b8bcca8eec45ee0eb166edc674795e53a2b53d1a9ef263eecebaac85
          command:
            - /bin/sh
            - -ec
            - |
              umask 077
              {
                printf '%s\n' 'bind 0.0.0.0' 'protected-mode yes' 'port 6379' 'save ""'
                printf '%s\n' 'appendonly no' 'maxmemory 64mb' 'maxmemory-policy noeviction'
                printf 'requirepass %s\n' "$(cat /run/secrets/redis-password)"
              } > /run/redis/redis.conf
              exec redis-server /run/redis/redis.conf
          ports:
            - name: redis
              containerPort: 6379
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - 'REDISCLI_AUTH="$(cat /run/secrets/redis-password)" redis-cli -h 127.0.0.1 ping | grep -qx PONG'
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - 'REDISCLI_AUTH="$(cat /run/secrets/redis-password)" redis-cli -h 127.0.0.1 ping | grep -qx PONG'
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - 'REDISCLI_AUTH="$(cat /run/secrets/redis-password)" redis-cli -h 127.0.0.1 ping | grep -qx PONG'
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 96Mi
            limits:
              cpu: 250m
              memory: 192Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: credentials
              mountPath: /run/secrets
              readOnly: true
            - name: runtime
              mountPath: /run/redis
      volumes:
        - name: credentials
          secret:
            secretName: nextcloud-redis-auth
            defaultMode: 0440
        - name: runtime
          emptyDir:
            sizeLimit: 1Mi
