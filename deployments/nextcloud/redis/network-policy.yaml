---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nextcloud-redis
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: nextcloud-redis
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: nextcloud
              app.kubernetes.io/instance: nextcloud
              app.kubernetes.io/component: app
      ports:
        - protocol: TCP
          port: 6379
