fullnameOverride: jellyfin

controllers:
  main:
    replicas: 1
    pod:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      annotations:
        # media = the read-only mount of Nextcloud's data (3.3 TiB) - Nextcloud
        # owns it and backs it up itself; including it here would duplicate the
        # entire library. cache = regenerable transcode scratch.
        backup.velero.io/backup-volumes-excludes: media,cache
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        # Group 33 = www-data, Group 44 = video (for V4L2 hardware acceleration)
        supplementalGroups: [33, 44]
    containers:
      app:
        image:
          repository: jellyfin/jellyfin
          # 12.0 is a release-candidate preview (not yet stable) - opted in
          # deliberately for the Live TV "tuner not releasing" fix, EPG
          # fixes, and .NET 10 performance rewrite polish. Pre-upgrade
          # Velero backup: jellyfin-preupgrade-v12-rc3 (config + cache,
          # media volume excluded per the existing backup-volumes-excludes
          # annotation). Revert to 10.11.11 (last stable 10.11.x release,
          # includes the same security fixes) if this causes problems.
          tag: "12.0-rc3"
          pullPolicy: IfNotPresent
        env:
          TZ: America/New_York
        resources:
          requests: { cpu: "50m", memory: "512Mi" }
          limits:   { cpu: "2",    memory: "4Gi" }
        securityContext:
          privileged: false
          allowPrivilegeEscalation: false

service:
  main:
    ports:
      http:
        port: 8096

ingress:
  main:
    enabled: false   # you’re using Traefik IngressRoute separately

persistence:
  config:
    enabled: true
    # 5Gi -> 15Gi (2026-08-04). Jellyfin 12's `MoveTrickplayFiles`
    # migration relocated trickplay scrub-preview tiles INTO the config
    # volume (/config/data/trickplay). That alone is ~1.6G for 183 items
    # and grows with the library, which filled the 5Gi volume and put
    # Jellyfin in CrashLoopBackOff -- it refuses to start with <2GiB free
    # ("The path `/config/data` has insufficient free space").
    # NOTE: this is headroom, not a root-cause fix. Trickplay growth is
    # unbounded as the library grows; see 09-Apps for tuning options.
    size: 15Gi
    accessMode: ReadWriteOnce
    storageClass: ceph-fs-data-ec
    globalMounts:
      - path: /config

  cache:
    enabled: true
    size: 250Gi
    accessMode: ReadWriteOnce
    storageClass: ceph-fs-data-ec
    globalMounts:
      - path: /cache

  media:
    enabled: true
    existingClaim: jellyfin-media-ro
    globalMounts:
      - path: /media
        readOnly: true

  # V4L2 Hardware Acceleration - Mount entire /dev for video/media device autodiscovery
  # Jellyfin probes all /dev/video* and /dev/media* nodes and binds to correct encoders/decoders
  # Device numbers are dynamic and vary between boots, so mounting all devices is required
  dev:
    enabled: true
    type: hostPath
    hostPath: /dev
    globalMounts:
      - path: /dev
