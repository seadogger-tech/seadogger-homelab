---
# HDHomeRun HLS restream (dormant).
#
# Adopted into Git from the hand-applied live objects (OCE-164, 2026-11-23).
# The Deployment has been scaled to 0 since 2025-12. Jellyfin does not use it:
# Live TV reads the tuner directly (http://192.168.1.70) and gets its guide
# from xmltv-proxy. Keep replicas at 0 unless you mean to restart it.
#
# The HDHomeRun CONNECT DUO has 2 tuners, but each ffmpeg container below holds
# one tuner stream open permanently. Scaling to 1 starts 24 streams, so at most
# 2 channels can work and the rest retry every 2s. Trim the channel list before
# re-enabling.
#
# Images are pinned by digest. ffmpeg 9.0.2-cli-ls90 is the build `latest`
# pointed to on 2026-11-23 (multi-arch, includes arm64). It was tested on the
# cluster with a 20s capture of channel 2.1 served through this nginx config.
apiVersion: v1
kind: ConfigMap
metadata:
  name: hdhomerun-hls-nginx-conf
  namespace: jellyfin
data:
  default.conf: |
    server {
        listen 80;
        server_name localhost;

        location / {
            root /usr/share/nginx/html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Access-Control-Allow-Origin "*";
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }
        }
    }

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hdhomerun-hls
  namespace: jellyfin
spec:
  replicas: 0
  selector:
    matchLabels:
      app: hdhomerun-hls
  template:
    metadata:
      labels:
        app: hdhomerun-hls
    spec:
      containers:
        - name: nginx
          image: nginx:1.31.9-alpine@sha256:fb4658584bd9a916ffb6f6e365f97c25cfdb2923801f551ea08356e695f14ff7
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          volumeMounts:
            - name: hls-storage
              mountPath: /usr/share/nginx/html
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
        - name: ffmpeg-2-1
          image: linuxserver/ffmpeg:9.0.2-cli-ls90@sha256:66fa8e2351fb78f9dad2c59c946be2658edcc529339320da3f2cf788312368af
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              mkdir -p /hls/2_1
              while true; do
                ffmpeg -hide_banner -loglevel warning \
                  -i "http://192.168.1.70:5004/auto/v2.1" \
                  -c copy \
                  -f hls \
                  -hls_time 8 \
                  -hls_list_size 40 \
                  -hls_flags delete_segments+independent_segments \
                  -hls_segment_filename "/hls/2_1/segment_%03d.ts" \
                  /hls/2_1/index.m3u8 || sleep 2
              done
          volumeMounts:
            - name: hls-storage
              mountPath: /hls
        - name: ffmpeg-2-2
          image: linuxserver/ffmpeg:9.0.2-cli-ls90@sha256:66fa8e2351fb78f9dad2c59c946be2658edcc529339320da3f2cf788312368af
