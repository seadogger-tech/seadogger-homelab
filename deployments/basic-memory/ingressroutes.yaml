apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: basic-memory-redirect-https
spec:
  redirectScheme:
    scheme: https
    permanent: true
    port: "443"

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: basic-memory-http
spec:
  entryPoints: ["web"]
  routes:
    - match: Host(`basic-memory.seadogger-homelab`)
      kind: Rule
      middlewares:
        - name: basic-memory-redirect-https
      services:
        - name: basic-memory
          port: 8000

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: basic-memory-https
spec:
  entryPoints: ["websecure"]
  routes:
    - match: Host(`basic-memory.seadogger-homelab`)
      kind: Rule
      services:
        - name: basic-memory
          port: 8000
  tls:
    secretName: basic-memory-local-tls
