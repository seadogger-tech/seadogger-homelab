apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mealie

resources:
  - deployment.yaml
  - service.yaml
  - pvc.yaml
  - certificate.yaml
  - ingressroutes.yaml

configMapGenerator:
  - name: mealie-custom-prompts
    files:
      - prompts/parse-recipe-ingredients.txt
      - prompts/parse-recipe-image.txt
      - prompts/parse-recipe-video.txt
      - prompts/scrape-recipe.txt
