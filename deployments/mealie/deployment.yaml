apiVersion: apps/v1
kind: Deployment
metadata:
  name: mealie
  labels:
    app: mealie
spec:
  replicas: 1
  strategy:
    type: Recreate   # SQLite on RWO PVC; one pod only
  selector:
    matchLabels:
      app: mealie
  template:
    metadata:
      labels:
        app: mealie
    spec:
      nodeSelector:
        kubernetes.io/arch: arm64
      containers:
        - name: mealie
          # Stock upstream mealie-recipes/mealie v3.30.0, pinned by the
          # multi-arch index digest (includes linux/arm64, child manifest
          # sha256:8dbe3fd73896e77c797f7029201823fa8b1ddbc725059f496cf884f06c9916da).
          # The former custom build (v3.21.0 + cherry-picked PRs #7618/#7825)
          # was retired. To roll back, restore the previous custom image by its
          # recorded digest - do NOT assume a stock v3.21.0 tag is schema
          # compatible with a database already migrated by v3.30.0.
          image: ghcr.io/mealie-recipes/mealie:v3.30.0@sha256:90f83da6f3ab0a421efc827118a556168573930105f13fa3321768f42163d784
          imagePullPolicy: Always
          env:
            - name: BASE_URL
              value: "https://mealie.seadogger-homelab"
            - name: TZ
              value: "America/New_York"
            - name: PUID
              value: "911"
            - name: PGID
              value: "911"
            - name: OPENAI_CUSTOM_PROMPT_DIR
              value: "/app/custom-prompts"
          ports:
            - name: http
              containerPort: 9000
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: custom-prompts
              mountPath: /app/custom-prompts/recipes
          resources:
            requests:
              cpu: "50m"
              memory: "320Mi"   # was 256Mi; measured 306Mi working set (2026-10-31)
            limits:
              cpu: "1000m"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /api/app/about
              port: 9000
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/app/about
              port: 9000
            initialDelaySeconds: 60
            periodSeconds: 30
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mealie-data
        - name: custom-prompts
          configMap:
            name: mealie-custom-prompts
