crds:
  enabled: true

image:
  repository: rook/ceph
  tag: v1.18.1
  pullPolicy: IfNotPresent

resources:
  limits:
    # 200m -> 1 CPU (2026-10-31): at 200m the operator was throttled in 88% of
    # CFS periods (31 min in its first hour), which made every Ceph change
    # roll slowly. It idles near zero; the limit only matters while reconciling.
    cpu: "1"
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

discover:
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule

csi:
  provisionerTolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  pluginTolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule

  # CSI plugin/provisioner containers are control-plane shims (attach/mount
  # bookkeeping), not I/O-critical daemons like OSD/mon/mgr - safe to run
  # lean. Rook's built-in defaults (250m plugin, 100m per provisioner
  # sidecar) reserved ~2.4 cores cluster-wide for components that measured
  # near 0m actual usage even during active recovery.
  csiRBDPluginResource: |
    - name : driver-registrar
      resource:
        requests:
          memory: 32Mi   # was 128Mi; peak 24.3Mi (B0 limit 512Mi -> 40Mi)
          cpu: 25m
        limits:
          memory: 40Mi
    - name : csi-rbdplugin
      resource:
        requests:
          memory: 64Mi   # live request; the repo's 128Mi is not what the Driver CR carries
          cpu: 100m
        limits:
          memory: 128Mi   # was 1Gi; peak 102.2Mi (B0)
    - name : liveness-prometheus
      resource:
        requests:
          memory: 32Mi   # was 128Mi; measured 5-21Mi
          cpu: 25m
        limits:
          memory: 48Mi   # was 256Mi; peak 37.9Mi (B0)
  # NOTE: with ROOK_USE_CSI_OPERATOR these *ProvisionerResource values have
  # no effect: on every start the operator re-renders the Driver CRs, taking
  # the controller plugin request from the node *PluginResource and leaving
  # the sidecars unset. See rook_ceph_deploy_part1.yml.
  csiRBDProvisionerResource: |
    - name : csi-provisioner
      resource:
        requests:
          memory: 32Mi   # measured 13-45Mi working set, <=63Mi peak (2026-10-31)
          cpu: 50m
        limits:
          memory: 256Mi
    - name : csi-resizer
      resource:
        requests:
          memory: 32Mi   # measured 13-45Mi working set, <=63Mi peak (2026-10-31)
          cpu: 50m
        limits:
          memory: 256Mi
    - name : csi-attacher
      resource:
        requests:
          memory: 32Mi   # measured 13-45Mi working set, <=63Mi peak (2026-10-31)
          cpu: 50m
        limits:
          memory: 256Mi
    - name : csi-snapshotter
      resource:
        requests:
          memory: 32Mi   # measured 13-45Mi working set, <=63Mi peak (2026-10-31)
          cpu: 50m
        limits:
          memory: 256Mi
    - name : csi-rbdplugin
      resource:
        requests:
          memory: 64Mi   # measured 20-29Mi working set, <=34Mi peak (2026-10-31)
          cpu: 100m
        limits:
          memory: 1Gi
    - name : liveness-prometheus
      resource:
        requests:
          memory: 32Mi   # was 128Mi; measured 5-21Mi
          cpu: 25m
        limits:
          memory: 256Mi
  csiCephFSPluginResource: |
    - name : driver-registrar
      resource:
        requests:
          memory: 32Mi   # was 128Mi; peak 24.3Mi (B0 limit 512Mi -> 40Mi)
          cpu: 25m
        limits:
          memory: 40Mi
    - name : csi-cephfsplugin
      resource:
        requests:
          memory: 64Mi   # live request; the repo's 128Mi is not what the Driver CR carries
          cpu: 100m
        limits:
          memory: 144Mi   # was 1Gi; peak 110.4Mi (B0)
    - name : liveness-prometheus
      resource:
        requests:
          memory: 32Mi   # was 128Mi; measured 5-21Mi
          cpu: 25m
        limits:
          memory: 48Mi   # was 256Mi; peak 37.9Mi (B0)
  csiCephFSProvisionerResource: |
    - name : csi-provisioner
      resource:
        requests:
          memory: 32Mi   # measured 13-45Mi working set, <=63Mi peak (2026-10-31)
          cpu: 50m
        limits:
          memory: 256Mi
    - name : csi-resizer
      resource:
        requests:
          memory: 32Mi   # measured 13-45Mi working set, <=63Mi peak (2026-10-31)
          cpu: 50m
        limits:
          memory: 256Mi
    - name : csi-attacher
      resource:
        requests:
          memory: 32Mi   # measured 13-45Mi working set, <=63Mi peak (2026-10-31)
          cpu: 50m
        limits:
          memory: 256Mi
    - name : csi-snapshotter
      resource:
        requests:
          memory: 32Mi   # measured 13-45Mi working set, <=63Mi peak (2026-10-31)
          cpu: 50m
        limits:
          memory: 256Mi
    - name : csi-cephfsplugin
      resource:
        requests:
          memory: 64Mi   # measured 20-29Mi working set, <=34Mi peak (2026-10-31)
          cpu: 100m
        limits:
          memory: 1Gi
    - name : liveness-prometheus
      resource:
        requests:
          memory: 32Mi   # was 128Mi; measured 5-21Mi
          cpu: 25m
        limits:
          memory: 256Mi
